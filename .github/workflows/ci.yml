name: CI

# Lancé à chaque Pull Request et à chaque push sur develop et main
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests unitaires (Vitest)
        run: npm test
      - run: npm run build
